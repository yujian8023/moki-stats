name: Initialize Contests (One-time)

on:
  workflow_dispatch:  # 手动触发

jobs:
  init:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Fetch all contests (initialization)
        run: |
          node src/fetch.js --all

      - name: Fetch moki details
        run: |
          node src/fetch.js --fetch-mokis || true

      - name: Generate statistics
        run: node src/stats.js

      - name: Run analysis
        run: node src/analyze.js

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "🎉 Initial data import: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
      
      - name: Upload data artifact
        uses: actions/upload-artifact@v4
        with:
          name: contest-data
          path: data/
          retention-days: 30
