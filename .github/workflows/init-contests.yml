name: Initialize Contests (One-time)

on:
  workflow_dispatch:  # 手动触发

permissions:
  contents: write  # 允许推送代码

jobs:
  init:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}  # 使用 GitHub Token

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Fetch all contests (directly to docs/data/)
        env:
          DATA_DIR: docs/data  # 直接生成到 docs/data/
        run: |
          echo "🚀 开始获取竞赛数据..."
          echo "📂 DATA_DIR: $DATA_DIR"
          echo "📂 Current dir: $(pwd)"
          echo "📂 docs exists: $(ls -la | grep docs || echo 'not found')"
          mkdir -p docs/data  # 确保目录存在
          node src/fetch.js --all 2>&1 | tee fetch.log
          echo "✅ 竞赛获取完成"
          echo "📂 Generated files:"
          ls -la docs/data/ || echo "docs/data/ not found"

      - name: Show fetch logs
        if: always()
        run: |
          echo "=== Fetch Logs ==="
          cat fetch.log || echo "No fetch log"

      - name: Fetch moki details
        env:
          DATA_DIR: docs/data
        run: |
          node src/fetch.js --fetch-mokis || true

      - name: Generate statistics
        env:
          DATA_DIR: docs/data
        run: node src/stats.js

      - name: Run analysis
        env:
          DATA_DIR: docs/data
        run: node src/analyze.js

      - name: Show generated files
        run: |
          echo "=== 生成的文件 ==="
          ls -la docs/data/
          ls -la docs/data/stats/

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "🎉 Initial data import: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
      
      - name: Upload data artifact
        uses: actions/upload-artifact@v4
        with:
          name: contest-data
          path: docs/data/
          retention-days: 30
