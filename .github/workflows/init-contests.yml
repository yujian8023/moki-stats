name: Initialize Contests (One-time)

on:
  workflow_dispatch:  # 手动触发

permissions:
  contents: write  # 允许推送代码

jobs:
  init:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}  # 使用 GitHub Token

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Fetch all contests (initialization)
        run: |
          echo "🚀 开始获取竞赛数据..."
          node src/fetch.js --all 2>&1 | tee fetch.log
          echo "✅ 竞赛获取完成"

      - name: Show fetch logs
        if: always()
        run: |
          echo "=== Fetch Logs ==="
          cat fetch.log || echo "No fetch log"

      - name: Fetch moki details
        run: |
          node src/fetch.js --fetch-mokis || true

      - name: Generate statistics
        run: node src/stats.js

      - name: Run analysis
        run: node src/analyze.js

      - name: Copy data to docs folder (for GitHub Pages)
        run: |
          echo "📄 复制数据到 docs 目录..."
          mkdir -p docs/data
          cp -r data/contests docs/data/
          cp -r data/leaderboards docs/data/
          cp -r data/mokis docs/data/
          cp data/contest_index.json docs/data/
          cp data/stats/*.json docs/data/stats/
          cp -r docs/*.html docs/ 2>/dev/null || true
          cp -r docs/*.js docs/ 2>/dev/null || true
          cp -r docs/*.css docs/ 2>/dev/null || true
          echo "✅ 数据复制完成"
          ls -la docs/data/

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "🎉 Initial data import + docs update: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
      
      - name: Upload data artifact
        uses: actions/upload-artifact@v4
        with:
          name: contest-data
          path: data/
          retention-days: 30
