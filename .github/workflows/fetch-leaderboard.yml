name: Fetch Leaderboard (Fallback)

on:
  schedule:
    - cron: '6 * * * *'  # 每小时第 6 分钟（作为备份检查）
  workflow_dispatch:

jobs:
  check-and-fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Check for ended contests
        id: check
        run: |
          node -e "
            const { getContestsNeedingLeaderboard } = await import('./src/utils.js');
            const contests = await getContestsNeedingLeaderboard();
            const ids = contests.map(c => c._id).join(',');
            console.log('NEEDS_LB=' + ids);
          " 2>&1 | tee output.log
          LB_IDS=$(grep "NEEDS_LB=" output.log | cut -d'=' -f2 || echo "")
          echo "leaderboard_ids=$LB_IDS" >> $GITHUB_OUTPUT

      - name: Fetch leaderboards
        if: steps.check.outputs.leaderboard_ids != ''
        run: |
          node src/fetch.js --leaderboards "${{ steps.check.outputs.leaderboard_ids }}"

      - name: Run analysis
        if: steps.check.outputs.leaderboard_ids != ''
        run: node src/analyze.js

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "🏆 Auto-fetch leaderboard: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
