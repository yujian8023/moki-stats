name: Fetch Contests (Incremental)

on:
  schedule:
    - cron: '6 * * * *'  # 每小时第 6 分钟
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Fetch incremental contests (directly to docs/data/)
        env:
          DATA_DIR: docs/data  # 直接生成到 docs/data/
        run: |
          node src/fetch.js --incremental

      - name: Fetch moki details
        env:
          DATA_DIR: docs/data
        run: |
          node src/fetch.js --fetch-mokis || true

      - name: Generate statistics
        env:
          DATA_DIR: docs/data
        run: node src/stats.js

      - name: Run analysis
        env:
          DATA_DIR: docs/data
        run: node src/analyze.js

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "📊 Auto-update: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
