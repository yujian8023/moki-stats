name: Fetch Contests (Incremental)

on:
  schedule:
    - cron: '6 * * * *'  # 每小时第 6 分钟
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Fetch incremental contests (directly to docs/data/)
        env:
          DATA_DIR: docs/data
        run: |
          echo "📂 DATA_DIR: $DATA_DIR"
          mkdir -p docs/data
          node src/fetch.js --incremental

      - name: Check for finished contests and fetch leaderboards
        env:
          DATA_DIR: docs/data
        run: |
          echo "🏆 检查已结束的竞赛并抓取 leaderboard..."
          node src/leaderboard.js --check-finished || true

      - name: Fetch moki details
        env:
          DATA_DIR: docs/data
        run: |
          node src/fetch.js --fetch-mokis || true

      - name: Generate statistics
        env:
          DATA_DIR: docs/data
        run: |
          echo "📊 生成统计报告..."
          node src/stats.js
          
          # 生成每日统计（跨天时自动创建新文件）
          node src/generate-daily.js || true

      - name: Run analysis
        env:
          DATA_DIR: docs/data
        run: node src/analyze.js

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "📊 Auto-update: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
