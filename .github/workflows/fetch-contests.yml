name: Fetch Contests (Incremental)

on:
  schedule:
    - cron: '6 * * * *'  # 每小时第 6 分钟
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Fetch incremental contests
        run: |
          node src/fetch.js --incremental

      - name: Fetch moki details
        run: |
          node src/fetch.js --fetch-mokis || true

      - name: Generate statistics
        run: node src/stats.js

      - name: Run analysis
        run: node src/analyze.js

      - name: Copy data to docs folder (for GitHub Pages)
        run: |
          echo "📄 复制数据到 docs 目录..."
          mkdir -p docs/data
          cp -r data/contests docs/data/
          cp -r data/leaderboards docs/data/
          cp -r data/mokis docs/data/
          cp data/contest_index.json docs/data/
          cp data/stats/*.json docs/data/stats/
          echo "✅ 数据复制完成"

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "📊 Auto-update + docs: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
