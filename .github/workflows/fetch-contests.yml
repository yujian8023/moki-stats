name: Fetch Contests (Incremental)

on:
  schedule:
    - cron: '6 * * * *'  # 每小时第 6 分钟
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Fetch incremental contests
        env:
          DATA_DIR: docs/data
        run: |
          echo "📊 获取新竞赛..."
          node src/fetch.js --incremental

      - name: Fetch recent leaderboards
        env:
          DATA_DIR: docs/data
        run: |
          echo "🏆 抓取最近结束的竞赛 leaderboard..."
          # 只抓取过去 1 小时内结束的竞赛
          node src/leaderboard.js --recent-finished 1

      - name: Fetch moki details
        env:
          DATA_DIR: docs/data
        run: |
          node src/fetch.js --fetch-mokis || true

      - name: Generate statistics
        env:
          DATA_DIR: docs/data
        run: |
          echo "📊 生成统计报告..."
          node src/generate-daily.js

      - name: Show stats
        run: |
          echo "=== 统计概览 ==="
          cat docs/data/stats/daily/$(date -u +%Y-%m-%d).json 2>/dev/null | jq '{players: .totalPlayers, mokis: (.mokiAppearances|keys|length), strats: (.strategyAppearances|keys|length)}' || echo "No daily stats yet"
          cat docs/data/stats/summary.json | jq '{players: .totalPlayers, mokis: (.mokiAppearances|keys|length), strats: (.strategyAppearances|keys|length)}'
          
      - name: Commit and push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "📊 Auto-update: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
