<!-- 时间范围选择和搜索框 - 添加到 Header 之后 -->
<div class="container mx-auto px-4 py-6">
  <div class="ga-card rounded-lg p-6 mb-6">
    <div class="flex flex-col md:flex-row gap-4">
      <!-- 时间范围选择 -->
      <div class="flex-1">
        <label class="block text-sm font-medium text-ga-text-muted mb-2">
          📅 时间范围
        </label>
        <div class="flex gap-2 flex-wrap">
          <button 
            v-for="range in timeRanges" 
            :key="range.value"
            @click="selectTimeRange(range.value)"
            :class="[
              'px-4 py-2 rounded-lg font-medium transition-all',
              selectedTimeRange === range.value 
                ? 'bg-ga-accent text-black' 
                : 'bg-ga-card border border-ga-border text-ga-text-muted hover:border-ga-accent'
            ]"
          >
            {{ range.label }}
          </button>
        </div>
      </div>
      
      <!-- 竞赛名称搜索 -->
      <div class="flex-1">
        <label class="block text-sm font-medium text-ga-text-muted mb-2">
          🔍 搜索竞赛
        </label>
        <input 
          v-model="searchQuery"
          @input="debouncedSearch"
          type="text"
          placeholder="输入竞赛名称..."
          class="w-full px-4 py-2 bg-ga-card border border-ga-border rounded-lg text-ga-text placeholder-ga-text-muted focus:outline-none focus:border-ga-accent"
        />
      </div>
    </div>
  </div>
  
  <!-- 统计卡片 -->
  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
    <div class="ga-card rounded-lg p-4">
      <div class="text-sm text-ga-text-muted mb-1">总参赛人数</div>
      <div class="text-2xl font-bold">{{ formatNumber(currentStats.summary?.totalPlayers || 0) }}</div>
    </div>
    <div class="ga-card rounded-lg p-4">
      <div class="text-sm text-ga-text-muted mb-1">总卡牌数据</div>
      <div class="text-2xl font-bold">{{ formatNumber(currentStats.summary?.totalCards || 0) }}</div>
      <div class="text-xs text-ga-text-muted mt-1">top50 × 5 卡 × 竞赛数</div>
    </div>
    <div class="ga-card rounded-lg p-4">
      <div class="text-sm text-ga-text-muted mb-1">不同卡牌</div>
      <div class="text-2xl font-bold">{{ formatNumber(currentStats.summary?.uniqueCards || 0) }}</div>
    </div>
    <div class="ga-card rounded-lg p-4">
      <div class="text-sm text-ga-text-muted mb-1">总奖池</div>
      <div class="text-2xl font-bold text-ga-accent">{{ formatPrizePool(currentStats.summary?.totalPrizePool || 0) }}</div>
      <div class="text-xs text-ga-text-muted mt-1">GEMs</div>
    </div>
  </div>
</div>
